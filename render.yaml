services:
  - type: web
    name: smarttransit-api
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: SMARTTRANSIT_STORAGE
        value: mongodb
      - key: SMARTTRANSIT_MONGODB_URI
        sync: false
      - key: SMARTTRANSIT_MONGODB_DB
        value: smarttransit
      - key: SMARTTRANSIT_MONGODB_COLLECTION
        value: app_state
      - key: SMARTTRANSIT_ALLOWED_ORIGIN
        sync: false
      - key: SMARTTRANSIT_EMAIL_PROVIDER
        value: brevo
      - key: SMARTTRANSIT_BREVO_API_KEY
        sync: false
      - key: SMARTTRANSIT_MAIL_FROM
        sync: false
      - key: SMARTTRANSIT_OTP_SECRET
        sync: false
      - key: SMARTTRANSIT_ALLOWED_SIGNUP_EMAIL_DOMAINS
        value: ""
